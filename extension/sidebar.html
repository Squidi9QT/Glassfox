<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="player" class="player">
    <div class="art" id="art">
      <div class="art-glow"></div>
      <span class="bars big"><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="now">
      <div class="now-name" id="now-name">Музыка</div>
      <div class="now-genre" id="now-genre">Выберите станцию</div>
    </div>

    <div class="controls">
      <button class="play" id="play" title="Играть / пауза">
        <svg class="i-play" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2v9.6c0 .6.6.9 1.1.6l7.4-4.8a.7.7 0 0 0 0-1.2L6.1 2.6C5.6 2.3 5 2.6 5 3.2Z"/></svg>
        <svg class="i-pause" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
      </button>
    </div>

    <div class="volume">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5a4 4 0 0 1 0 6M12.5 3a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>

    <div class="error" id="error" hidden></div>
  </div>

  <h2>Станции</h2>
  <ul class="stations" id="stations"></ul>

  <details class="add">
    <summary>Добавить свою станцию</summary>
    <form id="add-form">
      <input class="field" id="add-name" placeholder="Название" required maxlength="40">
      <input class="field" id="add-url" type="url" placeholder="Ссылка на поток (https://…mp3)" required>
      <button class="add-btn" type="submit">Добавить</button>
    </form>
  </details>

  <script src="sidebar.js"></script>
</body>
</html>
